name: Feature request
description: Propose a focused improvement to the bridge or its tooling
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing a solution. Substantial authentication, transport, containment, release-layout, or compatibility changes should be discussed here before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or operator need should the project address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or smaller options you considered.
  - type: textarea
    id: security
    attributes:
      label: Security and operational impact
      description: Explain effects on authentication, TLS, containment, ACLs, listener exposure, release inventory, or controller compatibility.
      placeholder: None, or a specific impact analysis
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: I removed credentials and private operational data.
          required: true
        - label: I will follow the [Code of Conduct](https://github.com/bgrablin/hermes-windows-bridge/blob/main/CODE_OF_CONDUCT.md).
          required: true
