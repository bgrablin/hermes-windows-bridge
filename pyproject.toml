[project]
name = "hermes-windows-bridge"
version = "1.0.0"
description = "Pinned-TLS execution bridge for a Windows Hermes host"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist", "local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
